name: Deploy Atelier 3D
on:
  push:
    branches: [main]
    paths:
      - 'atelier-v3-source.b64'
      - '.github/workflows/atelier-v3-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atelier-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app and installers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
          base64 -d atelier-v3-source.b64 > /tmp/atelier-source.zip
          python -m zipfile -e /tmp/atelier-source.zip /tmp/atelier-src
          python /tmp/atelier-src/package_installers.py
          python /tmp/atelier-src/build_windows.py
          mkdir -p public
          cp /tmp/atelier-src/index.html /tmp/atelier-src/accounts.js /tmp/atelier-src/web_gate.js /tmp/atelier-src/web_auth.js /tmp/atelier-src/web_scene.js public/
          cp -R /tmp/atelier-src/downloads public/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: public/downloads/Atelier3D-Setup.exe
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
